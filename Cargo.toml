[package]
name = "presse"
version = "0.3.2"
edition = "2024"
authors = ["Simon Buré"]
description = "Fast PDF compression CLI — JPEG recompression and structural optimization"
license = "GPL-3.0"
repository = "https://github.com/SimonBure/presse"
homepage = "https://github.com/SimonBure/presse"
keywords = ["pdf", "compression", "cli", "images", "optimization"]
categories = ["command-line-utilities", "compression"]

[package.metadata.wix]
upgrade-guid = "908C4A9D-CBD9-4772-A0DE-B033A3CC9C74"
path-guid = "20B73937-7905-4D33-B513-8D635C4BB57C"
license = false
eula = false

[dependencies]
# PDF manipulation
lopdf = "0.44"

# CLI
clap = { version = "4", features = ["derive"] }

# Progress bar
indicatif = "0.17"
image = "0.25.9"

# Parallel image re-encoding
rayon = "1.12"

[patch.crates-io]
# Vendored fork of lopdf 0.39.0 with a fix for its xref writer (see
# vendor/lopdf/README.md) — upstream lopdf writes corrupt cross-reference
# sections whenever object numbering has gaps and truncates entries past the
# pre-stream `size`, producing PDFs that qpdf rejects and poppler can render
# as blank pages. No API changes.
lopdf = { path = "vendor/lopdf" }

[dev-dependencies]
# Same major/minor as the main deps, shared by tests/ and examples/ (corpus generator)
lopdf = "0.39"
image = "0.25"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
